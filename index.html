                const count = c.id === 'all' ? allTemplates().length : allTemplates().filter(t => t.category === c.id).length;
                if (c.id === 'mine' && !count) return '';
                return `<button onclick="setGalleryCat('${c.id}')" aria-pressed="${cat === c.id}" class="h-11 px-4 shrink-0 rounded-full text-sm font-bold whitespace-nowrap transition-colors ${cat === c.id ? 'bg-brand-600 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700'}">${c.icon ? c.icon + ' ' : ''}${c.label}</button>`;
            };
            return `
                <div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-stretch sm:items-center justify-center sm:p-4" onclick="if(event.target === this) closeGallery();">
                    <div class="bg-slate-50 dark:bg-slate-950 sm:rounded-3xl shadow-2xl w-full max-w-5xl sm:max-h-[90vh] flex flex-col overflow-hidden" role="dialog" aria-modal="true" aria-labelledby="gallery-title">
                        <div class="bg-white dark:bg-slate-900 border-b border-slate-100 dark:border-slate-800">
                            <div class="px-4 sm:px-6 pt-4 flex items-center justify-between gap-3">
                                <div>
                                    <h2 id="gallery-title" class="text-xl font-extrabold text-slate-900 dark:text-white">Template gallery</h2>
                                    <p class="text-sm text-slate-500 dark:text-slate-400">Pick a routine, then edit it however you like.</p>
                                </div>
                                <button id="gallery-close" onclick="closeGallery()" class="w-12 h-12 grid place-items-center hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl transition-colors text-slate-600 dark:text-slate-300 shrink-0" aria-label="Close gallery">${icons.X}</button>
                            </div>
                            <div class="flex gap-2 px-4 sm:px-6 py-3 overflow-x-auto no-scrollbar">${TEMPLATE_CATEGORIES.map(catButton).join('')}</div>
                        </div>
                        <div class="flex-1 overflow-y-auto p-4 sm:p-6">
                            ${list.length ? `
                            <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
                                ${list.map(t => {
                                    const total = totalMinutesOf(t.activities);
                                    const custom = t.category === 'mine';
                                    return `
                                    <article class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-100 dark:border-slate-800 shadow-sm p-4 flex flex-col gap-3">
                                        <div class="flex items-center gap-3">
                                            ${miniPieSVG(t.activities, 60)}
                                            <div class="min-w-0">
                                                <h3 class="font-bold text-slate-900 dark:text-white leading-tight"><span aria-hidden="true">${t.icon}</span> ${escapeHTML(t.name)}</h3>
                                                <p class="text-xs font-semibold text-slate-500 dark:text-slate-400 mt-1">${t.activities.length} steps • ${formatDuration(total)}</p>
                                            </div>
                                        </div>
                                        <p class="text-sm text-slate-600 dark:text-slate-300">${escapeHTML(t.description || '')}</p>
                                        <ul class="flex flex-wrap gap-1.5">
                                            ${t.activities.map((a, i) => `<li class="inline-flex items-center gap-1.5 px-2 py-1 rounded-lg bg-slate-50 dark:bg-slate-800 text-xs font-semibold text-slate-700 dark:text-slate-200">${swatchSVG(a, i, 12)}${escapeHTML(a.name)} <span class="text-slate-400">${a.duration}m</span></li>`).join('')}
                                        </ul>
                                        <div class="flex gap-2 mt-auto pt-1">
                                            <button onclick="applyTemplateById('${t.id}')" class="${btnPrimary} flex-1 h-12 rounded-xl font-bold">Use template</button>
                                            ${custom
                                                ? `<button onclick="deleteCustomTemplate('${t.id}')" class="${btnSecondary} w-12 h-12 grid place-items-center rounded-xl" aria-label="Delete template ${escapeHTML(t.name)}" title="Delete template"><span class="i5">${icons.Trash2}</span></button>`
                                                : `<button onclick="copyTemplateLink('${t.id}')" class="${btnSecondary} w-12 h-12 grid place-items-center rounded-xl" aria-label="Copy link to ${escapeHTML(t.name)}" title="Copy a shareable link"><span class="i5">${icons.Link}</span></button>`}
                                        </div>
                                    </article>`;
                                }).join('')}
                            </div>` : `<p class="text-center text-slate-500 py-12">No templates here yet.</p>`}
                        </div>
                    </div>
                </div>`;
        }

        function deleteModal() {
            return `
                <div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div class="bg-white dark:bg-slate-900 rounded-3xl shadow-2xl max-w-sm w-full p-6" role="alertdialog" aria-modal="true" aria-labelledby="delete-title">
                        <h2 id="delete-title" class="text-xl font-bold mb-4 text-slate-900 dark:text-white">Confirm Delete</h2>
                        <p class="text-slate-600 dark:text-slate-300 mb-6">Are you sure you want to delete ${Array.isArray(state.deleteConfirmation) ? state.deleteConfirmation.length + ' activities' : 'this activity'}?</p>
                        <div class="flex gap-3">
                            <button onclick="cancelDelete()" class="${btnSecondary} flex-1 h-12 font-bold rounded-xl transition-all">Cancel</button>
                            <button onclick="confirmDelete()" class="flex-1 h-12 bg-red-600 text-white font-bold rounded-xl hover:bg-red-700 transition-all">Delete</button>
                        </div>
                    </div>
                </div>`;
        }

        // Main Render Function
        function render() {
            const scrollContainer = document.getElementById('activities-scroll-container');
            const scrollTop = scrollContainer ? scrollContainer.scrollTop : 0;
            const activeElement = document.activeElement;
            const activeId = activeElement?.id;
            const cursorPosition = activeElement?.selectionStart;
            pendingRender = false;

            const displayMode = state.viewMode === 'timer' && state.mode === AppMode.RUNNING ? 'RUNNING' :
                                state.mode === AppMode.SUMMARY ? 'SUMMARY' : 'PLANNING';

            const mainContent = displayMode === 'RUNNING' ? runningView()
                : displayMode === 'SUMMARY' ? summaryView()
                : planningView();

            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="min-h-screen pb-12">
                    <nav class="border-b border-slate-100 dark:border-slate-800 sticky top-0 z-40 backdrop-blur-sm bg-white/85 dark:bg-slate-900/85 print-hidden">
                        <div class="container mx-auto px-3 sm:px-4 py-2 flex items-center justify-between gap-2">
                            <a href="./" onclick="event.preventDefault(); navigateToPlanner();" class="flex items-center justify-center gap-2 sm:gap-3 min-h-[48px] min-w-[48px] rounded-xl" aria-label="MyTimer.io home">
                                ${LOGO_SVG}
                                <span class="hidden sm:block text-xl font-extrabold text-slate-900 dark:text-white">MyTimer.io</span>
                            </a>
                            <div class="flex items-center gap-1">
                                ${state.mode === AppMode.RUNNING || state.mode === AppMode.SUMMARY ? navButton('navigateToTimer()', icons.PlayCircle, 'Go to timer', state.viewMode === 'timer') : ''}
                                ${navButton('navigateToPlanner()', icons.ClipboardList, 'Go to planner', state.viewMode === 'planner')}
                                ${navButton('toggleFloatClock()', icons.FloatWindow, 'Floating clock', isFloatActive(), isFloatActive())}
                                ${navButton('toggleDarkMode()', state.isDarkMode ? icons.Sun : icons.Moon, state.isDarkMode ? 'Light mode' : 'Dark mode')}
                                ${navButton('openSettings()', icons.Settings2, 'Settings')}
                            </div>
                        </div>
                    </nav>

                    <main class="container mx-auto px-4 py-6 sm:py-8">
                        ${mainContent}
                    </main>

                    ${state.galleryOpen ? galleryModal() : ''}
                    ${state.isSettingsOpen ? settingsModal() : ''}
                    ${state.deleteConfirmation ? deleteModal() : ''}
                </div>
            `;

            const clockHost = document.getElementById('main-clock');
            mainClock = clockHost ? new ClockView(clockHost, 'w-full h-full ck-shadow') : null;

            requestAnimationFrame(() => {
                const newScrollContainer = document.getElementById('activities-scroll-container');
                if (newScrollContainer && scrollTop > 0) newScrollContainer.scrollTop = scrollTop;
                if (activeId && activeId.startsWith('activity-input-')) {
                    const input = document.getElementById(activeId);
                    if (input) {
                        input.focus();
                        if (typeof cursorPosition === 'number') input.setSelectionRange(cursorPosition, cursorPosition);
                    }
                }
            });

            updatePanels();
        }

        // =====================================================================
        // FLOATING CLOCK
        // Two ways to float:
        //   1. In-page: a draggable, resizable window that sits over the page.
        //      Lives outside #app so re-renders never reset it.
        //   2. Pop-out: a real always-on-top window (Document Picture-in-Picture)
        //      that floats over PowerPoint, Slides, other tabs, etc.
        //      Chrome and Edge on desktop only; the button hides elsewhere.
        // =====================================================================
        const FLOAT_KEY = 'mytimer_float_clock';
        const PIP_SUPPORTED = 'documentPictureInPicture' in window;
        const floatState = { open: false, minimized: false, ghost: false, x: null, y: null, w: 280, h: 360 };
        let floatEl = null;
        let pipWindow = null;

        const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), Math.max(lo, hi));

        function loadFloatState() {
            try { Object.assign(floatState, JSON.parse(localStorage.getItem(FLOAT_KEY) || '{}')); } catch (e) { }
        }

        function saveFloatState() {
            try { localStorage.setItem(FLOAT_KEY, JSON.stringify(floatState)); } catch (e) { }
        }

        function isFloatActive() {
            return floatState.open || !!pipWindow;
        }

        function panelSkeleton() {
            return `<div class="fc-panel"><div class="fc-clock"></div><div class="fc-side"><div class="fc-info"></div><div class="fc-controls"></div></div></div>`;
        }

        function setHTML(el, html) {
            if (el && el._html !== html) {
                el.innerHTML = html;
                el._html = html;
            }
        }

        // Structure only; the changing numbers are filled in by updateLive()
        function panelInfoHTML() {
            if (state.mode === AppMode.RUNNING) {
                const a = state.activities[state.currentIndex];
                if (a) {
                    return `
                        <div class="fc-name"><span class="fc-dot" style="background:${a.color}"></span><span class="fc-name-text">${escapeHTML(a.name || 'Untitled Activity')}</span></div>
                        <div class="fc-count" data-live="countdown"></div>
                        <div class="fc-meta">${state.isRunning ? '' : (isFreshSession() ? 'Ready • ' : 'Paused • ')}Activity ${state.currentIndex + 1} of ${state.activities.length}</div>`;
                }
            }
            if (state.mode === AppMode.SUMMARY) {
                return `<div class="fc-count fc-now">Done!</div><div class="fc-meta">Session complete</div>`;
            }
            const total = totalMinutesOf(state.activities);
            return `
                <div class="fc-count fc-now" data-live="now"></div>
                <div class="fc-meta">${state.activities.length ? `${state.activities.length} activities • ${formatDuration(total)} planned` : 'No activities planned yet'}</div>`;
        }

        function panelControlsHTML() {
            if (state.mode === AppMode.RUNNING) {
                return `
                    <button class="fc-ctl primary" data-act="pause">${state.isRunning ? icons.Pause + 'Pause' : icons.Play + (isFreshSession() ? 'Start' : 'Resume')}</button>
                    <button class="fc-ctl" data-act="skip" title="Skip to next activity" aria-label="Skip to next activity">${icons.SkipForward}</button>
                    <button class="fc-ctl" data-act="reset" title="End session" aria-label="End session">${icons.RotateCcw}</button>`;
            }
            if (state.mode === AppMode.SUMMARY) {
                return `<button class="fc-ctl primary" data-act="reset">${icons.RotateCcw}Plan new session</button>`;
            }
            return state.activities.length ? `<button class="fc-ctl primary" data-act="start">${icons.Play}Start</button>` : '';
        }

        // Refresh the structure of the floating clock and the pop-out window
        function updatePanels() {
            const floatVisible = floatEl && floatState.open && !pipWindow;
            const pipOpen = pipWindow && !pipWindow.closed;
            if (floatVisible || pipOpen) {
                const info = panelInfoHTML();
                const controls = panelControlsHTML();
                const roots = [];
                if (floatVisible) roots.push(floatEl);
                if (pipOpen) roots.push(pipWindow.document);
                roots.forEach(root => {
                    setHTML(root.querySelector('.fc-info'), info);
                    setHTML(root.querySelector('.fc-controls'), controls);
                });
                if (pipOpen) pipWindow.document.documentElement.classList.toggle('dark', state.isDarkMode);
            }
            updateLive(true);
        }

        function handlePanelClick(e) {
            const btn = e.target.closest('[data-act]');
            if (!btn) return;
            switch (btn.dataset.act) {
                case 'pip': openPip(); break;
                case 'ghost':
                    floatState.ghost = !floatState.ghost;
                    saveFloatState();
                    applyFloatLayout();
                    break;
                case 'min':
                    floatState.minimized = !floatState.minimized;
                    saveFloatState();
                    applyFloatLayout();
                    break;
                case 'close':
                    floatState.open = false;
                    saveFloatState();
                    applyFloatLayout();
                    render();
                    break;
                case 'pause': togglePause(); break;
                case 'skip': skipActivity(); break;
                case 'reset': resetSession(); break;
                case 'start': startSession(); break;
            }
        }

        function positionFloat() {
            const vw = document.documentElement.clientWidth;
            const vh = window.innerHeight;
            const w = clamp(floatState.w, 230, vw - 16);
            const h = clamp(floatState.h, 190, vh - 16);

            floatEl.style.width = w + 'px';
            floatEl.style.height = floatState.minimized ? 'auto' : h + 'px';

            if (floatState.x === null || floatState.y === null) {
                // First time: tuck into the bottom-right corner
                floatState.x = vw - w - 24;
                floatState.y = vh - h - 24;
            }
            const elH = floatState.minimized ? floatEl.offsetHeight : h;
            const x = clamp(floatState.x, 8, vw - w - 8);
            const y = clamp(floatState.y, 8, vh - elH - 8);
            floatEl.style.left = x + 'px';
            floatEl.style.top = y + 'px';
            return { x, y, w, h };
        }

        function applyFloatLayout() {
            if (!floatEl) return;
            floatEl.hidden = !floatState.open || !!pipWindow;
            floatEl.classList.toggle('min', floatState.minimized);
            floatEl.classList.toggle('ghost', floatState.ghost);

            const ghostBtn = floatEl.querySelector('[data-act="ghost"]');
            ghostBtn.classList.toggle('on', floatState.ghost);
            ghostBtn.setAttribute('aria-pressed', String(floatState.ghost));

            const minBtn = floatEl.querySelector('[data-act="min"]');
            minBtn.innerHTML = floatState.minimized ? icons.Expand : icons.Minus;
            minBtn.title = floatState.minimized ? 'Expand' : 'Minimize';
            minBtn.setAttribute('aria-label', minBtn.title);

            if (!floatEl.hidden) {
                updatePanels();
                positionFloat();
            }
        }

        function createFloatClock() {
            floatEl = document.createElement('div');
            floatEl.className = 'fc';
            floatEl.id = 'float-clock';
            floatEl.hidden = true;
            floatEl.setAttribute('role', 'region');
            floatEl.setAttribute('aria-label', 'Floating clock');
            floatEl.innerHTML = `
                <div class="fc-bar" title="Drag to move">
                    <span class="fc-grip" aria-hidden="true">${icons.Grip}</span>
                    <span class="fc-title" data-live="floatTitle">Clock</span>
                    ${PIP_SUPPORTED ? `<button class="fc-btn" data-act="pip" title="Pop out: float over other apps" aria-label="Pop out: float over other apps">${icons.PopOut}</button>` : ''}
                    <button class="fc-btn" data-act="ghost" title="See-through" aria-label="See-through">${icons.Ghost}</button>
                    <button class="fc-btn" data-act="min" title="Minimize" aria-label="Minimize">${icons.Minus}</button>
                    <button class="fc-btn" data-act="close" title="Close" aria-label="Close">${icons.X}</button>
                </div>
                <div class="fc-body">${panelSkeleton()}</div>
                <div class="fc-resize" title="Drag to resize" aria-hidden="true"></div>
            `;
            document.body.appendChild(floatEl);
            floatClock = new ClockView(floatEl.querySelector('.fc-clock'));
            floatEl.addEventListener('click', handlePanelClick);

            // Drag to move (mouse, pen and touch)
            const bar = floatEl.querySelector('.fc-bar');
            bar.addEventListener('pointerdown', e => {
                if (e.target.closest('button') || e.button > 0) return;
                e.preventDefault();
                const rect = floatEl.getBoundingClientRect();
                const offX = e.clientX - rect.left;
                const offY = e.clientY - rect.top;
                bar.setPointerCapture(e.pointerId);
                floatEl.classList.add('dragging');

                const move = ev => {
                    floatState.x = ev.clientX - offX;
                    floatState.y = ev.clientY - offY;
                    const p = positionFloat();
                    floatState.x = p.x;
                    floatState.y = p.y;
                };
                const up = () => {
                    bar.removeEventListener('pointermove', move);
                    bar.removeEventListener('pointerup', up);
                    bar.removeEventListener('pointercancel', up);
                    floatEl.classList.remove('dragging');
                    saveFloatState();
                };
                bar.addEventListener('pointermove', move);
                bar.addEventListener('pointerup', up);
                bar.addEventListener('pointercancel', up);
            });

            // Drag corner to resize
            const handle = floatEl.querySelector('.fc-resize');
            handle.addEventListener('pointerdown', e => {
                e.preventDefault();
                e.stopPropagation();
                const rect = floatEl.getBoundingClientRect();
                const startX = e.clientX, startY = e.clientY;
                handle.setPointerCapture(e.pointerId);
                floatEl.classList.add('dragging');

                const move = ev => {
                    const vw = document.documentElement.clientWidth;
                    const vh = window.innerHeight;
                    floatState.w = clamp(rect.width + ev.clientX - startX, 230, vw - rect.left - 8);
                    floatState.h = clamp(rect.height + ev.clientY - startY, 190, vh - rect.top - 8);
                    positionFloat();
                };
                const up = () => {
                    handle.removeEventListener('pointermove', move);
                    handle.removeEventListener('pointerup', up);
                    handle.removeEventListener('pointercancel', up);
                    floatEl.classList.remove('dragging');
                    saveFloatState();
                };
                handle.addEventListener('pointermove', move);
                handle.addEventListener('pointerup', up);
                handle.addEventListener('pointercancel', up);
            });

            window.addEventListener('resize', () => {
                if (floatEl && !floatEl.hidden) positionFloat();
            });
        }

        function toggleFloatClock() {
            if (pipWindow) {
                // Turning the feature off closes the pop-out too
                floatState.open = false;
                saveFloatState();
                pipWindow.close();
                return;
            }
            // Chrome/Edge: one click floats the clock over everything (like SWBATs).
            // Other browsers fall back to the in-page floating clock.
            if (PIP_SUPPORTED && !floatState.open) {
                openPip();
                return;
            }
            floatState.open = !floatState.open;
            saveFloatState();
            applyFloatLayout();
            render();
        }

        async function openPip() {
            if (!PIP_SUPPORTED) return;
            if (pipWindow) { pipWindow.focus(); return; }

            let win;
            try {
                win = await documentPictureInPicture.requestWindow({ width: 300, height: 360 });
            } catch (err) {
                console.error('Could not open the pop-out clock', err);
                return;
            }
            pipWindow = win;

            const doc = win.document;
            doc.documentElement.classList.add('pip-root');
            doc.documentElement.classList.toggle('dark', state.isDarkMode);
            const style = doc.createElement('style');
            style.textContent = document.getElementById('fc-css').textContent;
            doc.head.appendChild(style);
            doc.body.innerHTML = `${patternDefsHTML()}<div class="fc fc-pip"><div class="fc-body">${panelSkeleton()}</div></div>`;
            doc.body.addEventListener('click', handlePanelClick);
            pipClock = new ClockView(doc.querySelector('.fc-clock'));

            // The pop-out stays visible while the main tab is in the background,
            // so it drives the countdown with its own heartbeat.
            win.setInterval(heartbeat, 250);

            win.addEventListener('pagehide', () => {
                pipWindow = null;
                pipClock = null;
                applyFloatLayout();
                render();
            });

            applyFloatLayout(); // hides the in-page float while the pop-out is open
            updatePanels();
            render();
        }

        // =====================================================================
        // LINKS: ?t=10 (quick timer) and ?template=pomodoro
        // =====================================================================
        function handleUrlParams() {
            const params = new URLSearchParams(location.search);
            let handled = false;
            if (params.has('t')) {
                const minutes = parseFloat(params.get('t'));
                if (minutes >= 1 && minutes <= 720) {
                    startQuickTimer(minutes, false);
                    handled = true;
                }
            } else if (params.has('template')) {
                const tpl = findTemplate(params.get('template'));
                if (tpl) {
                    applyTemplateById(tpl.id);
                    handled = true;
                }
            }
            if (params.has('t') || params.has('template')) {
                try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) { }
            }
            return handled;
        }

        // =====================================================================
        // INITIALIZE
        // =====================================================================
        // Remove any service worker left over from earlier versions of the site
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations()
                .then(regs => regs.forEach(reg => reg.unregister()))
                .catch(() => { });
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadFromLocalStorage();
            loadFloatState();
            document.documentElement.classList.toggle('dark', state.isDarkMode);
            document.body.insertAdjacentHTML('afterbegin', patternDefsHTML());

            initAudio();
            ['pointerdown', 'keydown'].forEach(evt =>
                document.addEventListener(evt, unlockAudio, { once: true, capture: true }));

            state.insights = generateInsights();
            createFloatClock();

            if (!handleUrlParams()) render();
            applyFloatLayout();

            setInterval(heartbeat, 250);
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) { tick(); updateLive(true); }
            });

            // Escape closes whichever dialog is open
            document.addEventListener('keydown', e => {
                if (e.key !== 'Escape') return;
                if (state.deleteConfirmation) cancelDelete();
                else if (state.isSettingsOpen) closeSettings();
                else if (state.galleryOpen) closeGallery();
            });
        });

        // Make functions available globally
        Object.assign(window, {
            addActivity, addBreak, updateActivity, handleActivityNameChange, handleInputFocus,
            handleInputKeydown, handleInputBlur, updateInsightsDisplay, deleteActivity, requestDelete,
            confirmDelete, cancelDelete, toggleSelect, toggleSelectAll, startSession, togglePause,
            resetSession, skipActivity, playSound, handleSoundChange, setVolume, loadPreset, toggleDarkMode,
            navigateToPlanner, navigateToTimer, handleSort, toggleFloatClock, startQuickTimer,
            applyTemplateById, copyTemplateLink, saveCurrentAsTemplate, deleteCustomTemplate,
            openGallery, closeGallery, setGalleryCat, setClockFace, togglePatterns, toggleSeconds,
            toggleConfirmDelete, openSettings, closeSettings, cyclePattern, saveToLocalStorage, state
        });
    </script>
</body>
</html>
