    <style>
        /* Ensure proper dark mode text contrast */
        .dark .text-slate-900 { color: rgb(241 245 249) !important; }
        .dark .text-slate-800 { color: rgb(248 250 252) !important; }
        .dark .text-slate-700 { color: rgb(226 232 240) !important; }
        .dark .text-slate-600 { color: rgb(203 213 225) !important; }
        .dark .text-black { color: white !important; }

        [hidden] { display: none !important; }

        /* Touch: every control is at least 44x44 and taps don't wait for double-tap zoom */
        #app button, #toast-root button { min-height: 44px; min-width: 44px; touch-action: manipulation; }
        :focus-visible { outline: 3px solid #2A64DB; outline-offset: 2px; }
        .dark :focus-visible { outline-color: #8FB4F7; }
        .i5 svg { width: 20px; height: 20px; }
        .i4 svg { width: 16px; height: 16px; }
        .tabnums { font-variant-numeric: tabular-nums; }
        .no-scrollbar { scrollbar-width: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        /* Toast */
        #toast-root { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 80; width: max-content; max-width: calc(100vw - 32px); }
        .toast { display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 18px; border-radius: 16px; background: #1F2430; color: #fff; font: 600 15px/1.3 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; box-shadow: 0 16px 40px -12px rgb(15 23 42 / .45); animation: toast-in .2s ease-out; }
        .toast-btn { border: 0; border-radius: 12px; padding: 0 16px; background: #DCE8FD; color: #14254A; font: 800 14px/1 ui-sans-serif, system-ui, sans-serif; cursor: pointer; }
        @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

        /* Respect the system "reduce motion" setting */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
                scroll-behavior: auto !important;
            }
            .active\:scale-95:active, .active\:scale-90:active, .active\:scale-\[0\.98\]:active { transform: none !important; }
        }

        @media print {
            body { background-color: white !important; color: black !important; }
            nav, .print-hidden, .fc, #toast-root { display: none !important; }
            main { display: block !important; margin: 0 !important; padding: 0 !important; }
            section { box-shadow: none !important; border: none !important; margin-bottom: 20px !important; }
        }
    </style>

    <!-- Floating clock + clock face styles. Plain CSS (no Tailwind) so the
         same rules can be copied into the pop-out window. -->
    <style id="fc-css">
        /* ---- Clock face ---- */
        .ck-face { fill: #ffffff; stroke: #DCE8FD; }
        .dark .ck-face { fill: #1e293b; stroke: #334155; }
        .ck-tick { stroke: #e2e8f0; }
        .dark .ck-tick { stroke: #475569; }
        .ck-tick-major { stroke: #94a3b8; }
        .ck-num { fill: #64748b; font-weight: 700; font-size: 10px; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; user-select: none; }
        .dark .ck-num { fill: #94a3b8; }
        .ck-wedge { opacity: .72; }
        .ck-hour { stroke: #1F2430; }
        .dark .ck-hour { stroke: #e2e8f0; }
        .ck-min { stroke: #2A64DB; }
        .dark .ck-min { stroke: #8FB4F7; }
        .ck-sec { stroke: #E8604C; }
        .ck-cap { fill: #1F2430; }
        .dark .ck-cap { fill: #ffffff; }
        .ck-pin { fill: #E8604C; }
        .ck-shadow { filter: drop-shadow(0 20px 22px rgb(31 36 48 / 0.14)); }

        /* ---- Wedge patterns (optional, for telling activities apart without color) ---- */
        .ck-pat { fill: rgba(31, 36, 48, .5); stroke: none; }
        .ck-pat-line { fill: none; stroke: rgba(31, 36, 48, .5); stroke-width: 1.4; }
        .dark .ck-pat { fill: rgba(255, 255, 255, .6); }
        .dark .ck-pat-line { stroke: rgba(255, 255, 255, .6); }

        /* ---- Floating window ---- */
        .fc {
            position: fixed;
            z-index: 60;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, .94);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border: 1px solid #DCE8FD;
            border-radius: 18px;
            box-shadow: 0 24px 48px -16px rgb(15 23 42 / .35), 0 2px 6px rgb(15 23 42 / .08);
            overflow: hidden;
            color: #0f172a;
            font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            transition: opacity .2s ease;
            box-sizing: border-box;
        }
        .fc[hidden] { display: none; }
        .dark .fc { background: rgba(15, 23, 42, .94); border-color: #334155; color: #f1f5f9; }
        .fc.ghost { opacity: .4; }
        .fc.ghost:hover, .fc.ghost.dragging, .fc.ghost:focus-within { opacity: 1; }
        .fc.min { height: auto !important; }
        .fc.min .fc-body, .fc.min .fc-resize { display: none; }

        .fc-bar {
            display: flex;
            align-items: center;
            gap: 2px;
            padding: 2px 2px 2px 8px;
            background: #DCE8FD;
            color: #1F2430;
            cursor: grab;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            flex-shrink: 0;
        }
        .dark .fc-bar { background: #1D3A73; color: #f1f5f9; }
        .fc.dragging .fc-bar { cursor: grabbing; }
        .fc-grip { display: grid; place-items: center; opacity: .55; }
        .fc-grip svg { width: 14px; height: 14px; }
        .fc-title {
            flex: 1;
            min-width: 0;
            font-size: 13px;
            font-weight: 800;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-variant-numeric: tabular-nums;
        }
        .fc-btn {
            width: 44px;
            height: 44px;
            flex-shrink: 0;
            display: grid;
            place-items: center;
            border: 0;
            border-radius: 12px;
            background: transparent;
            color: inherit;
            cursor: pointer;
            padding: 0;
            touch-action: manipulation;
        }
        .fc-btn:hover { background: rgba(255, 255, 255, .55); }
        .fc-btn.on { background: rgba(255, 255, 255, .85); }
        .dark .fc-btn:hover { background: rgba(255, 255, 255, .12); }
        .dark .fc-btn.on { background: rgba(255, 255, 255, .2); }
        .fc-btn svg { width: 18px; height: 18px; }

        .fc-body { flex: 1; min-height: 0; container-type: size; }
        .fc-panel {
            height: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 12px 14px;
        }
        .fc-clock { flex: 1 1 0; min-height: 0; min-width: 0; width: 100%; display: flex; justify-content: center; }
        .fc-clock svg { width: 100%; height: 100%; display: block; }
        .fc-side { display: flex; flex-direction: column; align-items: center; gap: 6px; flex-shrink: 0; max-width: 100%; }
        .fc-info { display: flex; flex-direction: column; align-items: center; gap: 3px; max-width: 100%; }
        .fc-name { display: flex; align-items: center; gap: 6px; max-width: 100%; font-size: 13px; font-weight: 700; }
        .fc-name-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .fc-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
        .fc-count {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-weight: 800;
            font-size: clamp(20px, 15cqmin, 72px);
            line-height: 1;
            color: #2A64DB;
            font-variant-numeric: tabular-nums;
        }
        .dark .fc-count { color: #8FB4F7; }
        .fc-count.fc-now { color: #0f172a; }
        .dark .fc-count.fc-now { color: #f1f5f9; }
        .fc-meta { font-size: 11px; font-weight: 600; color: #64748b; text-align: center; }
        .dark .fc-meta { color: #94a3b8; }
        .fc-controls { display: flex; gap: 6px; }
        .fc-ctl {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            min-width: 44px;
            min-height: 44px;
            border: 0;
            border-radius: 12px;
            padding: 0 12px;
            font: 800 13px/1 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
            background: #f1f5f9;
            color: #334155;
            cursor: pointer;
            touch-action: manipulation;
        }
        .fc-ctl:hover { background: #e2e8f0; }
        .dark .fc-ctl { background: #1e293b; color: #e2e8f0; }
        .dark .fc-ctl:hover { background: #334155; }
        .fc-ctl.primary { background: #2A64DB; color: #ffffff; }
        .fc-ctl.primary:hover { background: #2150B3; }
        .fc-ctl svg { width: 16px; height: 16px; }
        .fc-btn:focus-visible, .fc-ctl:focus-visible { outline: 3px solid #2A64DB; outline-offset: 2px; }

        .fc-resize {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 28px;
            height: 28px;
            cursor: nwse-resize;
            touch-action: none;
            background:
                linear-gradient(135deg, transparent 55%, #94a3b8 55%, #94a3b8 62%, transparent 62%, transparent 72%, #94a3b8 72%, #94a3b8 79%, transparent 79%);
            opacity: .7;
        }

        /* Wide window: clock on the left, text on the right */
        @container (min-aspect-ratio: 5/4) {
            .fc-panel { flex-direction: row; gap: 14px; padding: 10px 16px; }
            .fc-clock { flex: 0 1 auto; height: 100%; width: auto; aspect-ratio: 1; }
            .fc-side { align-items: flex-start; max-width: 55%; }
            .fc-info { align-items: flex-start; }
            .fc-meta { text-align: left; }
        }
        /* Small window: drop the extras, keep clock + countdown */
        @container (max-height: 250px) and (max-aspect-ratio: 5/4) { .fc-controls { display: none; } }
        @container (max-height: 200px) and (max-aspect-ratio: 5/4) { .fc-meta { display: none; } }
        @container (max-height: 120px) { .fc-controls, .fc-meta, .fc-name { display: none; } }

        /* ---- Pop-out (Picture-in-Picture) window ---- */
        .pip-root, .pip-root body { margin: 0; height: 100%; background: #ffffff; }
        .pip-root.dark, .pip-root.dark body { background: #0f172a; }
        .fc.fc-pip {
            position: relative;
            z-index: auto;
            width: 100%;
            height: 100%;
            border: 0;
            border-radius: 0;
            box-shadow: none;
            background: transparent;
            -webkit-backdrop-filter: none;
            backdrop-filter: none;
        }

        @media (prefers-reduced-motion: reduce) {
            .fc, .toast { transition: none !important; animation: none !important; }
        }

            Grip: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="9" cy="5" r="1.6"></circle><circle cx="9" cy="12" r="1.6"></circle><circle cx="9" cy="19" r="1.6"></circle><circle cx="15" cy="5" r="1.6"></circle><circle cx="15" cy="12" r="1.6"></circle><circle cx="15" cy="19" r="1.6"></circle></svg>',
            SkipForward: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" x2="19" y1="5" y2="19"></line></svg>'
        };
        const lucide = (inner, fill = 'none') => `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="${fill}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
        Object.assign(icons, {
            Zap: lucide('<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>'),
            Link: lucide('<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>'),
            Repeat: lucide('<path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path>'),
            Library: lucide('<rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect>')
        });

        const LOGO_SVG = `<svg viewBox="0 0 128 128" width="40" height="40" aria-hidden="true"><circle cx="64" cy="64" r="58" fill="#fff" stroke="#3D7BF5" stroke-width="10"/><path d="M64 64 L64 14 A50 50 0 0 1 114 64 Z" fill="#5B8DEF"/><path d="M64 64 L114 64 A50 50 0 0 1 106.4 90.5 Z" fill="#6FD36F"/><path d="M64 64 L106.4 90.5 A50 50 0 0 1 33.4 103.4 Z" fill="#F7994A"/><path d="M64 64 L33.4 103.4 A50 50 0 0 1 14.8 55.3 Z" fill="#A97BDD"/><path d="M64 64 L14.8 55.3 A50 50 0 0 1 64 14 Z" fill="#DB6B8C"/><path d="M64 64V24M64 64H94" stroke="#1F2430" stroke-width="10" stroke-linecap="round" fill="none"/></svg>`;

        // Global State
        let state = {
            activities: [],
            mode: AppMode.PLANNING,
            viewMode: 'planner',
            currentIndex: 0,
            isRunning: false,
            activityEndsAt: null, // timestamp (ms) when the current activity ends; keeps time accurate in background tabs
            insights: "",
            isDarkMode: false,
            isSettingsOpen: false,
            deleteConfirmation: null,
            customTemplates: [],
            selectedIds: new Set(),
            selectedSound: 'chime',
            volume: 0.5,
            defaultBreakDuration: 5,
            confirmBeforeDelete: true,
            clockFace: 'auto',          // 'auto' (default: minute hand, hour hand past 60 min) | '60' | '12h'
            patternsOn: false,
            showSeconds: !REDUCED_MOTION,
            galleryOpen: false,
            galleryCat: 'all',
            stash: null,                // the user's plan, kept safe while a quick timer runs
            now: new Date(),
            dragItem: null,
            dragOverItem: null
        };

        // Utility Functions
        function generateId() {
            return 'id-' + Math.random().toString(36).substr(2, 9) + Date.now().toString(36);
        }

        function formatTime(seconds) {
            seconds = Math.max(0, Math.round(seconds));
            const h = Math.floor(seconds / 3600);
            const mins = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            const mm = (h ? mins.toString().padStart(2, '0') : mins.toString().padStart(2, '0'));
            return h ? `${h}:${mm}:${secs.toString().padStart(2, '0')}` : `${mm}:${secs.toString().padStart(2, '0')}`;
        }

        function formatDuration(minutes) {
            minutes = Math.round(minutes);
            if (minutes < 60) return `${minutes} min`;
            const h = Math.floor(minutes / 60), m = minutes % 60;
            return m ? `${h} h ${m} min` : `${h} h`;
        }

        function clockTime(date) {
            return date.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
        }

        function escapeHTML(str) {
            return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function totalMinutesOf(list) {
            return list.reduce((sum, a) => sum + (a.duration || 0), 0);
        }

        function saveToLocalStorage() {
            try {
                // While a quick timer runs, keep the user's real plan saved
                const plan = state.stash || state.activities;
                localStorage.setItem('focusflow_activities', JSON.stringify(plan));
                localStorage.setItem('focusflow_volume', state.volume.toString());
                localStorage.setItem('focusflow_sound', state.selectedSound);
                localStorage.setItem('focusflow_break_dur', state.defaultBreakDuration.toString());
                localStorage.setItem('focusflow_custom_templates', JSON.stringify(state.customTemplates));
                localStorage.setItem('focusflow_confirm_delete', state.confirmBeforeDelete.toString());
                localStorage.setItem('focusflow_dark_mode', state.isDarkMode.toString());
                localStorage.setItem('mytimer_patterns', state.patternsOn.toString());
                localStorage.setItem('mytimer_seconds', state.showSeconds.toString());
            } catch (e) { }
        }

        function generateInsights() {
            if (state.activities.length === 0) {
                return "Ready to plan your day? Start by adding your first task. Breaking down your day into manageable activities helps reduce overwhelm and builds momentum.";
            }

            const totalMinutes = state.activities.reduce((sum, a) => sum + a.duration, 0);
            const activityCount = state.activities.length;
            const hasBreaks = state.activities.some(a => a.name.toLowerCase().includes('break'));
            const longestTask = Math.max(...state.activities.map(a => a.duration));
            const shortTasks = state.activities.filter(a => a.duration <= 15).length;
            const mediumTasks = state.activities.filter(a => a.duration > 15 && a.duration <= 45).length;
            const longTasks = state.activities.filter(a => a.duration > 45).length;

            let insights = [];

            // Total time insights
            if (totalMinutes > 180) {
                insights.push("You've planned an ambitious session—over 3 hours. Remember, sustained focus works best in chunks. Consider whether you can tackle this today or if splitting across multiple sessions would feel more achievable.");
            } else if (totalMinutes > 90) {
                insights.push("Your session is about " + Math.round(totalMinutes / 60 * 10) / 10 + " hours. This is a solid focused work block. You're setting yourself up for meaningful progress.");
            } else if (totalMinutes >= 30) {
                insights.push("A " + totalMinutes + "-minute session is perfectly sized for maintaining focus and building momentum. You've got this.");
            } else {
                insights.push("Short, focused sessions like this can be incredibly powerful. Even " + totalMinutes + " minutes of intentional work creates forward movement.");
            }

            // Break insights
            if (!hasBreaks && totalMinutes > 60) {
                insights.push("I notice you haven't scheduled any breaks yet. Your brain needs micro-rests to sustain attention. Consider adding a 5-minute break after every hour to maintain your mental sharpness.");
            } else if (hasBreaks) {
                insights.push("Great call including breaks. These moments of restoration aren't weakness—they're strategic. Your future focused self will thank you.");
            }

            // Task structure insights
            if (longestTask > 60) {
                insights.push("Your longest task is " + longestTask + " minutes. If you find yourself avoiding it or feeling stuck, that might be a signal it needs breaking down further. What's the smallest first step you could start with?");
            }

            if (shortTasks > mediumTasks + longTasks && activityCount > 5) {
                insights.push("You've broken things into many small tasks—that's excellent for executive function. Each completion gives you a dopamine hit and reinforces your momentum. The cascade of small wins often matters more than one big accomplishment.");
            }

            if (longTasks >= 3) {
                insights.push("Several longer tasks here. Remember: you don't have to feel motivated to begin. Motivation often follows action, not the other way around. Start with just 5 minutes, and notice what happens.");
            }

            // Activity count insights
            if (activityCount === 1) {
                insights.push("Single-tasking—there's power in this simplicity. When you're only focusing on one thing, you eliminate decision fatigue. Just this, right now.");
            } else if (activityCount <= 3) {
                insights.push("A focused session with " + activityCount + " clear priorities. This level of intentionality is where productivity becomes sustainable rather than exhausting.");
            } else if (activityCount > 8) {
                insights.push("You've mapped out quite a few activities. Be gentle with yourself if you don't complete everything—flexibility is part of the process. What matters most if you can only finish half?");
            }

            // Motivational and executive function insights
            const motivationalInsights = [
                "Starting is often the hardest part. Once you begin, your brain's task-switching costs decrease and you'll find your rhythm. That first minute is an investment in the next 59.",
                "Notice: you're already here, planning. That's executive function in action. The fact that you're structuring your time means you're already succeeding at something many people struggle with.",
                "If you feel resistance, that's normal. Your brain is weighing effort against reward. Sometimes we just need to gently override that initial 'no' and trust the process.",
                "These aren't just tasks—they're commitments to your future self. Each one completed is evidence that you can trust yourself to follow through.",
                "Perfect conditions rarely exist. Starting where you are, with what you have, is the actual skill. You're building that skill right now.",
            ];

            insights.push(motivationalInsights[Math.floor(Math.random() * motivationalInsights.length)]);

            // Time-of-day contextual insights
            const hour = new Date().getHours();
            if (hour >= 6 && hour < 10) {
                insights.push("Morning energy is often your clearest cognitive window. If possible, front-load your most demanding work now while your mental resources are fresh.");
            } else if (hour >= 14 && hour < 16) {
                insights.push("Afternoon attention naturally dips around now. This is normal circadian biology. If you're feeling fuzzy, a 5-minute walk or stretching can reset your focus more than caffeine.");
            } else if (hour >= 20 && hour < 24) {
                insights.push("Evening sessions work differently than morning ones. Your analytical mind might be tired, but creative or maintenance tasks can flow easily now. Honor where your energy is.");
            }

            // Return 2-3 randomly selected insights for variety
            const selectedInsights = [];
            const shuffled = insights.sort(() => 0.5 - Math.random());
            const numInsights = Math.min(3, shuffled.length);
            
            for (let i = 0; i < numInsights; i++) {
                selectedInsights.push(shuffled[i]);
            }

            return selectedInsights.join(' ');
        }

        function loadFromLocalStorage() {
            const get = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
            const saved = get('focusflow_activities');
            const savedVol = get('focusflow_volume');
            const savedSound = get('focusflow_sound');
            const savedBreakDur = get('focusflow_break_dur');
            const savedCustomTemplates = get('focusflow_custom_templates');
            const savedConfirmDelete = get('focusflow_confirm_delete');
            const savedDarkMode = get('focusflow_dark_mode');
            const savedFace = get('mytimer_face_choice'); // only set when the user picks a face in Settings
            const savedPatterns = get('mytimer_patterns');
            const savedSeconds = get('mytimer_seconds');

            if (savedVol) state.volume = parseFloat(savedVol);
            if (savedBreakDur) state.defaultBreakDuration = parseInt(savedBreakDur);
            if (savedSound && SOUND_FILES[savedSound]) state.selectedSound = savedSound;
            if (savedCustomTemplates) {
                try {
                    state.customTemplates = JSON.parse(savedCustomTemplates).map((t, i) => ({
                        ...t,
                        id: t.id || ('custom-' + i + '-' + Date.now().toString(36)),
                        category: 'mine',
                        icon: t.icon || '⭐'
                    }));
                } catch (e) { }
            }
            if (savedConfirmDelete !== null) state.confirmBeforeDelete = savedConfirmDelete === 'true';
            if (['auto', '60', '12h'].includes(savedFace)) state.clockFace = savedFace;
            if (savedPatterns !== null) state.patternsOn = savedPatterns === 'true';
            if (savedSeconds !== null) state.showSeconds = savedSeconds === 'true';

            let darkModeValue = false;
            if (savedDarkMode !== null) {
                darkModeValue = savedDarkMode === 'true';
            } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                darkModeValue = true;
            }
            state.isDarkMode = darkModeValue;

            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    state.activities = parsed.map(a => ({
                        ...a,
                        completed: false,
                        remainingSeconds: a.duration * 60
                    }));
                } catch (e) { }
            }
        }

        // =====================================================================
        // PLAN EDITING
        // =====================================================================
        function addActivity() {
            const newId = generateId();
            const duration = 15;
            const colorIndex = state.activities.length % COLORS.length;
            state.activities.push({
                id: newId,
                name: "",
                duration: duration,
                color: COLORS[colorIndex],
                completed: false,
                remainingSeconds: duration * 60
            });
            state.insights = generateInsights();
            saveToLocalStorage();
            render();

            requestAnimationFrame(() => {
                const input = document.getElementById(`activity-input-${newId}`);
                if (input) input.focus();
            });
        }

        function addBreak() {
            const newId = generateId();
            state.activities.push({
                id: newId,
                name: "Break",
                duration: state.defaultBreakDuration,
                color: C.green,
                completed: false,
                remainingSeconds: state.defaultBreakDuration * 60
            });
            state.insights = generateInsights();
            saveToLocalStorage();
            render();
        }

        function updateActivity(id, updates) {
            const index = state.activities.findIndex(a => a.id === id);
            if (index !== -1) {
                if (updates.duration !== undefined) updates.duration = Math.min(720, Math.max(1, updates.duration));
                state.activities[index] = { ...state.activities[index], ...updates };
                if (updates.duration !== undefined) {
                    state.activities[index].remainingSeconds = updates.duration * 60;
                    state.insights = generateInsights();
                }
                saveToLocalStorage();
                if (updates.duration !== undefined) render();
            }
        }

        let nameInputTimeout = null;
        let isTyping = false;
        let pendingRender = false;

        function handleActivityNameChange(id, value) {
            isTyping = true;
            const index = state.activities.findIndex(a => a.id === id);
            if (index !== -1) {
                state.activities[index].name = value;
                saveToLocalStorage();
            }
            clearTimeout(nameInputTimeout);
            nameInputTimeout = setTimeout(() => {
                state.insights = generateInsights();
                updateInsightsDisplay();
            }, 2000);
        }

        function handleInputFocus(id) {
            isTyping = true;
            const input = document.getElementById(`activity-input-${id}`);
            if (input && input.value && input.value !== 'Untitled Activity') {
                input.dataset.originalValue = input.value;
                setTimeout(() => input.select(), 10);
            }
        }

        function handleInputKeydown(event, id) {
            const input = document.getElementById(`activity-input-${id}`);
            if (event.key === 'Enter') {
                event.preventDefault();
                input.blur();
            } else if (event.key === 'Escape') {
                event.preventDefault();
                if (input.dataset.originalValue) {
                    input.value = input.dataset.originalValue;
                    const index = state.activities.findIndex(a => a.id === id);
                    if (index !== -1) {
                        state.activities[index].name = input.dataset.originalValue;
                        saveToLocalStorage();
                    }
                }
                input.blur();
            }
        }

        function handleInputBlur(id) {
            isTyping = false;
            const input = document.getElementById(`activity-input-${id}`);
            const index = state.activities.findIndex(a => a.id === id);
            if (index !== -1 && !state.activities[index].name.trim()) {
                state.activities[index].name = "Untitled Activity";
                saveToLocalStorage();
                if (input) input.value = "Untitled Activity";
            }
            state.insights = generateInsights();
            updateInsightsDisplay();
            updateLive(true); // floating clock shows the new name
            if (pendingRender) { pendingRender = false; render(); }
        }

        function updateInsightsDisplay() {
            document.querySelectorAll('.coach-insights-text').forEach(el => {
                el.textContent = state.insights || "Add activities to receive personalized insights and coaching.";
            });
        }

        function deleteActivity(id) {
            state.activities = state.activities.filter(a => a.id !== id);
            state.selectedIds.delete(id);
            state.insights = generateInsights();
            saveToLocalStorage();
            render();
        }

        function deleteSelected() {
            state.activities = state.activities.filter(a => !state.selectedIds.has(a.id));
            state.selectedIds.clear();
            state.insights = generateInsights();
            saveToLocalStorage();
            render();
        }

        function requestDelete(id) {
            if (state.confirmBeforeDelete) {
                state.deleteConfirmation = id;
                render();
            } else if (Array.isArray(id)) {
                deleteSelected();
            } else {
                deleteActivity(id);
            }
        }

        function confirmDelete() {
            if (Array.isArray(state.deleteConfirmation)) deleteSelected();
            else deleteActivity(state.deleteConfirmation);
            state.deleteConfirmation = null;
            render();
        }

        function cancelDelete() {
            state.deleteConfirmation = null;
            render();
        }

        function toggleSelect(id) {
            if (state.selectedIds.has(id)) state.selectedIds.delete(id);
            else state.selectedIds.add(id);
            render();
        }

        function toggleSelectAll() {
            if (state.selectedIds.size === state.activities.length) state.selectedIds.clear();
            else state.selectedIds = new Set(state.activities.map(a => a.id));
            render();
        }

        function handleSort() {
            if (state.dragItem === null || state.dragOverItem === null) return;
            const items = [...state.activities];
            const draggedItem = items[state.dragItem];
            items.splice(state.dragItem, 1);
            items.splice(state.dragOverItem, 0, draggedItem);
            state.activities = items;
            state.dragItem = null;
            state.dragOverItem = null;
            saveToLocalStorage();
            render();
        }

        // ---- Patterns ----
        function resolvePattern(activity, index) {
            if (!state.patternsOn) return null;
            if (activity.pattern === 'none') return null;
            if (activity.pattern && PATTERN_IDS.includes(activity.pattern)) return activity.pattern;
            return PATTERN_IDS[index % PATTERN_IDS.length];
        }

        function patternLabel(id) {
            const p = PATTERNS.find(p => p.id === id);
            return p ? p.label : 'Solid';
        }

        function cyclePattern(id) {
            const index = state.activities.findIndex(a => a.id === id);
            if (index === -1) return;
            const order = [...PATTERN_IDS, 'none'];
            const current = resolvePattern(state.activities[index], index) || 'none';
            state.activities[index].pattern = order[(order.indexOf(current) + 1) % order.length];
            saveToLocalStorage();
            render();
        }

        // Shared <defs> for wedge patterns. Injected once per document.
        function patternDefsHTML() {
            const p = (id, inner, extra = '') => `<pattern id="mtp-${id}" width="8" height="8" patternUnits="userSpaceOnUse" ${extra}>${inner}</pattern>`;
            return `<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
                ${p('stripes', '<rect width="3" height="8" class="ck-pat"/>', 'patternTransform="rotate(45)"')}
                ${p('backslash', '<rect width="3" height="8" class="ck-pat"/>', 'patternTransform="rotate(-45)"')}
                ${p('dots', '<circle cx="4" cy="4" r="1.8" class="ck-pat"/>')}
                ${p('grid', '<path d="M0 .7H8M.7 0V8" class="ck-pat-line"/>')}
                ${p('hlines', '<rect width="8" height="2.6" class="ck-pat"/>')}
                ${p('zigzag', '<path d="M-1 6 L2 2 L4 6 L6 2 L9 6" class="ck-pat-line"/>')}
                ${p('checker', '<rect width="4" height="4" class="ck-pat"/><rect x="4" y="4" width="4" height="4" class="ck-pat"/>')}
            </defs></svg>`;
        }

        // Small color (+ pattern) disc used in lists so they match the clock
        function swatchSVG(activity, index, size = 16) {
            const pat = resolvePattern(activity, index);
            return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true" class="shrink-0"><circle cx="12" cy="12" r="11" fill="${activity.color}"/>${pat ? `<circle cx="12" cy="12" r="11" fill="url(#mtp-${pat})"/>` : ''}</svg>`;
        }

        // =====================================================================
        // SESSION + TIMER ENGINE
        // =====================================================================
        function startSession() {
            if (state.activities.length === 0) return;
            unlockAudio();
            state.mode = AppMode.RUNNING;
            state.viewMode = 'timer';
            state.currentIndex = 0;
            state.isRunning = true;
            state.activities = state.activities.map(a => ({
                ...a,
                completed: false,
                remainingSeconds: a.duration * 60
            }));
            startTimer();
            render();
        }

        // ---- Timer engine (timestamp-anchored) ----
        // Remaining time is calculated from a fixed end time rather than counted
        // down tick by tick, so it stays correct even when the browser slows
        // timers in a background tab (e.g. while PowerPoint is in front).
        // tick() is safe to call from anywhere, as often as you like.
        function tick() {
            if (state.mode !== AppMode.RUNNING || !state.isRunning || !state.activityEndsAt) return false;
            const now = Date.now();
            let changed = false;

            while (state.isRunning) {
                const current = state.activities[state.currentIndex];
                if (!current) {
                    finishSession();
                    changed = true;
                    break;
                }

                const remaining = Math.max(0, Math.ceil((state.activityEndsAt - now) / 1000));
                if (current.remainingSeconds !== remaining) {
                    current.remainingSeconds = remaining;
                    changed = true;
                }
                if (remaining > 0) break;

                // Current activity finished
                playSound();
                current.completed = true;
                changed = true;

                const nextIncomplete = state.activities.findIndex((a, i) => i > state.currentIndex && !a.completed);
                if (nextIncomplete !== -1) {
                    state.currentIndex = nextIncomplete;
                    // Chain from the previous end time so no time is lost if we were throttled
                    state.activityEndsAt += state.activities[nextIncomplete].remainingSeconds * 1000;
                } else {
                    finishSession();
                }
                saveToLocalStorage();
            }
            return changed;
        }

        function finishSession() {
            state.mode = AppMode.SUMMARY;
            state.isRunning = false;
            state.activityEndsAt = null;
        }

        function startTimer() {
            const current = state.activities[state.currentIndex];
            if (!current) return;
            state.activityEndsAt = Date.now() + current.remainingSeconds * 1000;
        }

        function stopTimer() {
            state.activityEndsAt = null;
        }

        function togglePause() {
            unlockAudio();
            if (state.isRunning) {
                tick(); // lock in the exact remaining time
                state.isRunning = false;
                stopTimer();
            } else {
                state.isRunning = true;
                startTimer();
            }
            render();
        }

        function resetSession() {
            stopTimer();
            state.mode = AppMode.PLANNING;
            state.viewMode = 'planner';
            state.currentIndex = 0;
            state.isRunning = false;
            if (state.stash) {
                // A quick timer just ended: bring the user's plan back
                state.activities = state.stash;
                state.stash = null;
            }
            state.activities = state.activities.map(a => ({
                ...a,
                completed: false,
                remainingSeconds: a.duration * 60
            }));
            state.insights = generateInsights();
            saveToLocalStorage();
            render();
        }

        function skipActivity() {
            if (state.isRunning) tick();
            if (state.mode !== AppMode.RUNNING) {
                render();
                return;
            }
            if (state.currentIndex >= state.activities.length - 1) {
                state.activities[state.currentIndex].completed = true;
                finishSession();
            } else {
                state.activities[state.currentIndex].completed = true;
                const nextIncomplete = state.activities.findIndex((a, i) => i > state.currentIndex && !a.completed);
                if (nextIncomplete !== -1) {
                    state.currentIndex = nextIncomplete;
                    if (state.isRunning) {
                        state.activityEndsAt = Date.now() + state.activities[nextIncomplete].remainingSeconds * 1000;
                    }
                } else {
                    finishSession();
                }
            }
            saveToLocalStorage();
            render();
        }

        // ---- Quick timers ----
        function startQuickTimer(minutes, autostart = true) {
            minutes = Math.round(parseFloat(minutes));
            if (!(minutes >= 1)) {
                showToast('Enter a number of minutes (1–720).');
                return;
            }
            minutes = Math.min(720, minutes);
            if (state.mode !== AppMode.PLANNING) resetSession();
            if (!state.stash) state.stash = state.activities;
            state.activities = [{
                id: generateId(),
                name: `${minutes}-minute timer`,
                duration: minutes,
                color: C.blue,
                completed: false,
                remainingSeconds: minutes * 60
            }];
            startSession();
            if (!autostart) {
                // Loaded from a link: ready to go, waiting for a tap (lets sound play later)
                state.isRunning = false;
                stopTimer();
                render();
            }
        }

        function isFreshSession() {
            const cur = state.activities[state.currentIndex];
            return state.mode === AppMode.RUNNING && !state.isRunning && state.currentIndex === 0 &&
                cur && cur.remainingSeconds === cur.duration * 60;
        }

        // ---- Templates ----
        function allTemplates() {
            return [...TEMPLATES, ...state.customTemplates];
        }

        function findTemplate(id) {
            return allTemplates().find(t => t.id === id);
        }

        function loadPreset(preset) {
            state.activities = preset.activities.map(a => ({
                id: generateId(),
                name: a.name,
                duration: a.duration,
                color: a.color,
                ...(a.pattern ? { pattern: a.pattern } : {}),
                completed: false,
                remainingSeconds: a.duration * 60
            }));
            state.selectedIds.clear();
            state.insights = generateInsights();
            saveToLocalStorage();
            render();
        }

        function applyTemplateById(id) {
            const tpl = findTemplate(id);
            if (!tpl) return;
            if (state.mode === AppMode.RUNNING && !state.stash) {
                if (!confirm('End the current session and load this template?')) return;
            }
            if (state.mode !== AppMode.PLANNING) resetSession();
            const previous = state.activities.map(a => ({ ...a }));
            state.galleryOpen = false;
            state.viewMode = 'planner';
            loadPreset(tpl);
            if (previous.length) {
                showToast(`Loaded “${tpl.name}”`, 'Undo', () => {
                    state.activities = previous;
                    state.insights = generateInsights();
                    saveToLocalStorage();
                    render();
                });
            } else {
                showToast(`Loaded “${tpl.name}”`);
            }
        }

        function templateLink(id) {
            const base = location.protocol === 'file:' ? 'https://mytimer.io/' : location.origin + location.pathname;
            return `${base}?template=${encodeURIComponent(id)}`;
        }

        async function copyTemplateLink(id) {
            const url = templateLink(id);
            try {
                await navigator.clipboard.writeText(url);
                showToast('Link copied. Anyone who opens it gets this template.');
            } catch (e) {
                window.prompt('Copy this link:', url);
            }
        }

        function saveCurrentAsTemplate() {
            if (!state.activities.length) return;
            const name = (window.prompt('Name this template:', '') || '').trim();
            if (!name) return;
            const total = totalMinutesOf(state.activities);
            state.customTemplates.push({
                id: 'custom-' + generateId(),
                category: 'mine',
                icon: '⭐',
                name,
                description: `${state.activities.length} steps • ${formatDuration(total)}`,
                activities: state.activities.map(a => ({
                    name: a.name || 'Untitled Activity',
                    duration: a.duration,
                    color: a.color,
                    ...(a.pattern ? { pattern: a.pattern } : {})
                }))
            });
            saveToLocalStorage();
            render();
            showToast(`Saved “${name}” to My templates`);
        }

        function deleteCustomTemplate(id) {
            const tpl = state.customTemplates.find(t => t.id === id);
            if (!tpl || !confirm(`Delete the template “${tpl.name}”?`)) return;
            state.customTemplates = state.customTemplates.filter(t => t.id !== id);
            saveToLocalStorage();
            render();
        }

        function openGallery(cat) {
            state.galleryOpen = true;
            if (cat) state.galleryCat = cat;
            render();
            requestAnimationFrame(() => document.getElementById('gallery-close')?.focus());
        }

        function closeGallery() {
            state.galleryOpen = false;
            render();
        }

        function setGalleryCat(cat) {
            state.galleryCat = cat;
            render();
        }

        // =====================================================================
        // SOUND (local files, unlocked on the first tap so they can play later)
        // =====================================================================
        const audioEls = {};
        let audioUnlocked = false;
        let audioCtx = null;

        function initAudio() {
            Object.entries(SOUND_FILES).forEach(([key, src]) => {
                const a = new Audio(src);
                a.preload = 'auto';
                audioEls[key] = a;
            });
        }

        function unlockAudio() {
            if (audioUnlocked) return;
            audioUnlocked = true;
            Object.values(audioEls).forEach(a => {
                a.muted = true;
                const p = a.play();
                if (p && p.then) {
                    p.then(() => { a.pause(); a.currentTime = 0; a.muted = false; })
                     .catch(() => { a.muted = false; });
                } else {
                    a.muted = false;
                }
            });
            try {
                audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
            } catch (e) { }
        }

        // Backup beep if a sound file can't play for any reason
        function beepFallback() {
            try {
                audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
                const t0 = audioCtx.currentTime;
                [0, 0.25].forEach(offset => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = 880;
                    gain.gain.setValueAtTime(0.0001, t0 + offset);
                    gain.gain.exponentialRampToValueAtTime(Math.max(0.001, state.volume * 0.6), t0 + offset + 0.01);
                    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + offset + 0.2);
                    osc.connect(gain).connect(audioCtx.destination);
                    osc.start(t0 + offset);
                    osc.stop(t0 + offset + 0.22);
                });
            } catch (e) { }
        }

        function playSound(name = state.selectedSound) {
            if (state.volume <= 0) return;
            const a = audioEls[name];
            if (!a || a.error) { beepFallback(); return; }
            try { a.pause(); a.currentTime = 0; } catch (e) { }
            a.muted = false;
            a.volume = state.volume;
            const p = a.play();
            if (p && p.catch) p.catch(() => beepFallback());
        }

        function handleSoundChange(newSound) {
            if (!SOUND_FILES[newSound]) return;
            unlockAudio();
            state.selectedSound = newSound;
            saveToLocalStorage();
            playSound(newSound);
            render();
        }

        function setVolume(value) {
            state.volume = parseFloat(value);
            const label = document.getElementById('volume-label');
            if (label) label.textContent = `${Math.round(state.volume * 100)}%`;
        }

        // =====================================================================
        // SETTINGS + NAVIGATION
        // =====================================================================
        function toggleDarkMode() {
            state.isDarkMode = !state.isDarkMode;
            document.documentElement.classList.toggle('dark', state.isDarkMode);
            saveToLocalStorage();
            render();
        }

        function setClockFace(face) {
            state.clockFace = face;
            try { localStorage.setItem('mytimer_face_choice', face); } catch (e) { }
            render();
        }

        function togglePatterns() {
            state.patternsOn = !state.patternsOn;
            saveToLocalStorage();
            render();
        }

        function toggleSeconds() {
            state.showSeconds = !state.showSeconds;
            saveToLocalStorage();
            render();
        }

        function toggleConfirmDelete() {
            state.confirmBeforeDelete = !state.confirmBeforeDelete;
            saveToLocalStorage();
            render();
        }

        function openSettings() {
            state.isSettingsOpen = true;
            render();
            requestAnimationFrame(() => document.getElementById('settings-close')?.focus());
        }

        function closeSettings() {
            state.isSettingsOpen = false;
            render();
        }

        function navigateToPlanner() {
            state.viewMode = 'planner';
            render();
        }

        function navigateToTimer() {
            if (state.mode === AppMode.RUNNING) {
                state.viewMode = 'timer';
            } else if (state.activities.length > 0) {
                startSession();
                state.viewMode = 'timer';
            }
            render();
        }

        // =====================================================================
        // TOAST
        // =====================================================================
        let toastTimer = null;
        function showToast(message, actionLabel, actionFn) {
            const root = document.getElementById('toast-root');
            root.innerHTML = `<div class="toast"><span>${escapeHTML(message)}</span>${actionLabel ? `<button class="toast-btn" type="button">${escapeHTML(actionLabel)}</button>` : ''}</div>`;
            if (actionLabel && actionFn) {
                root.querySelector('.toast-btn').addEventListener('click', () => { actionFn(); hideToast(); });
            }
            clearTimeout(toastTimer);
            toastTimer = setTimeout(hideToast, actionLabel ? 7000 : 3500);
        }
        function hideToast() {
            const root = document.getElementById('toast-root');
            if (root) root.innerHTML = '';
        }

        // =====================================================================
        // CLOCK FACE
        // One ClockView per visible clock (main page, floating window, pop-out).
        // The SVG is built once; each second only the hands and wedge shapes move.
        // =====================================================================

        // Minutes each activity still occupies on the clock
        function planWedges() {
            const running = state.mode === AppMode.RUNNING;
            if (state.mode === AppMode.SUMMARY) return [];
            return state.activities.map((a, i) => {
                let d;
                if (a.completed) d = 0;
                else if (running && i === state.currentIndex) d = a.remainingSeconds / 60;
                else if (running && i < state.currentIndex) d = 0;
                else d = a.duration;
                return { a, i, d };
            }).filter(w => w.d > 0);
        }

        // 60-minute face, or 12-hour face when the plan runs past an hour (auto)
        function faceInfo(wedges) {
            const total = wedges.reduce((s, w) => s + w.d, 0);
            let scale;
            if (state.clockFace === '12h') scale = 720;
            else if (state.clockFace === '60') scale = 60;
            else scale = total > 60 ? 720 : 60;
            return { scale, total, overflow: Math.max(0, total - scale) };
        }

        function faceLabel() {
            const wedges = planWedges();
            if (!wedges.length) return '';
            const f = faceInfo(wedges);
            if (f.scale === 720) {
                if (f.overflow > 0) return `Showing the next 12 hours · +${formatDuration(f.overflow)} more`;
                if (state.clockFace === 'auto') return `12-hour view · ${formatDuration(f.total)} ${state.mode === AppMode.RUNNING ? 'left' : 'planned'}`;
                return '';
            }
            if (f.overflow > 0) return `Showing the next hour · +${formatDuration(f.overflow)} more`;
            return '';
        }

        function wedgePath(cx, cy, r, startFrac, endFrac) {
            const pt = f => [cx + r * Math.sin(2 * Math.PI * f), cy - r * Math.cos(2 * Math.PI * f)];
            if (endFrac - startFrac >= 0.9999) {
                return `M ${cx} ${cy - r} A ${r} ${r} 0 1 1 ${cx} ${cy + r} A ${r} ${r} 0 1 1 ${cx} ${cy - r} Z`;
            }
            const [x0, y0] = pt(startFrac);
            const [x1, y1] = pt(endFrac);
            const large = endFrac - startFrac > 0.5 ? 1 : 0;
            return `M ${cx} ${cy} L ${x0.toFixed(2)} ${y0.toFixed(2)} A ${r} ${r} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z`;
        }

        class ClockView {
            constructor(container, extraClass = '') {
                const V = 240, R = 100, CX = 120;
                let ticks = '';
                for (let i = 0; i < 60; i++) {
                    const angle = (i * 6 * Math.PI) / 180;
                    const major = i % 5 === 0;
                    const innerR = major ? R - 8 : R - 4;
                    const x1 = Math.cos(angle - Math.PI / 2) * innerR + CX, y1 = Math.sin(angle - Math.PI / 2) * innerR + CX;
                    const x2 = Math.cos(angle - Math.PI / 2) * R + CX, y2 = Math.sin(angle - Math.PI / 2) * R + CX;
                    ticks += `<line x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}" class="${major ? 'ck-tick-major' : 'ck-tick'}" stroke-width="${major ? 2 : 1}"/>`;
                }
                let nums = '';
                for (let n = 1; n <= 12; n++) {
                    const angle = (n * 30 * Math.PI) / 180, tr = R - 22;
                    nums += `<text x="${(Math.cos(angle - Math.PI / 2) * tr + CX).toFixed(2)}" y="${(Math.sin(angle - Math.PI / 2) * tr + CX).toFixed(2)}" text-anchor="middle" dominant-baseline="middle" class="ck-num">${n}</text>`;
                }
                container.innerHTML = `
                    <svg viewBox="0 0 ${V} ${V}" class="${extraClass}" role="img" aria-label="Clock showing your planned activities">
                        <circle cx="${CX}" cy="${CX}" r="${R + 8}" class="ck-face" stroke-width="2"/>
                        ${ticks}${nums}
                        <g class="ck-wedges"></g>
                        <line class="ck-hour" x1="${CX}" y1="${CX}" x2="${CX}" y2="${CX - R * 0.5}" stroke-width="4" stroke-linecap="round"/>
                        <line class="ck-min" x1="${CX}" y1="${CX}" x2="${CX}" y2="${CX - R * 0.8}" stroke-width="3" stroke-linecap="round"/>
                        <line class="ck-sec" x1="${CX}" y1="${CX}" x2="${CX}" y2="${CX - R * 0.9}" stroke-width="1.5" stroke-linecap="round"/>
                        <circle cx="${CX}" cy="${CX}" r="4" class="ck-cap"/>
                        <circle cx="${CX}" cy="${CX}" r="1.5" class="ck-pin"/>
                    </svg>`;
                this.svg = container.querySelector('svg');
                this.wedgeGroup = this.svg.querySelector('.ck-wedges');
                this.hour = this.svg.querySelector('.ck-hour');
                this.min = this.svg.querySelector('.ck-min');
                this.sec = this.svg.querySelector('.ck-sec');
                this.pin = this.svg.querySelector('.ck-pin');
                this.signature = null;
                this.shapes = [];
                this.R = R;
                this.CX = CX;
            }

            update() {
                const now = state.now;
                const s = now.getSeconds();
                const m = now.getMinutes() + s / 60;
                const h = (now.getHours() % 12) + m / 60;
                const CX = this.CX;

                this.hour.setAttribute('transform', `rotate(${(h * 30).toFixed(2)} ${CX} ${CX})`);
                this.min.setAttribute('transform', `rotate(${(m * 6).toFixed(2)} ${CX} ${CX})`);
                this.sec.setAttribute('transform', `rotate(${s * 6} ${CX} ${CX})`);
                const secDisplay = state.showSeconds ? '' : 'none';
                if (this.sec.style.display !== secDisplay) {
                    this.sec.style.display = secDisplay;
                    this.pin.style.display = secDisplay;
                }

                // Wedges start at the minute hand (60-minute face) or hour hand (12-hour face)
                const wedges = planWedges();
                const face = faceInfo(wedges);
                let cursor = face.scale === 60 ? m : h * 60;
                let used = 0;
                const segs = [];
                for (const w of wedges) {
                    if (used >= face.scale) break;
                    const d = Math.min(w.d, face.scale - used);
                    segs.push({
                        w,
                        pattern: resolvePattern(w.a, w.i),
                        d: wedgePath(CX, CX, this.R, cursor / face.scale, (cursor + d) / face.scale)
                    });
                    cursor += d;
                    used += d;
                }

                const signature = segs.map(sg => sg.w.a.color + ':' + (sg.pattern || '')).join('|');
                if (signature !== this.signature) {
                    this.signature = signature;
                    this.wedgeGroup.innerHTML = segs.map(sg =>
                        `<path class="ck-wedge" fill="${sg.w.a.color}" stroke="white" stroke-width="0.5"/>` +
                        (sg.pattern ? `<path fill="url(#mtp-${sg.pattern})" pointer-events="none"/>` : '')
                    ).join('');
                    this.shapes = segs.map(() => []);
                    const paths = this.wedgeGroup.querySelectorAll('path');
                    let p = 0;
                    segs.forEach((sg, k) => {
                        this.shapes[k].push(paths[p++]);
                        if (sg.pattern) this.shapes[k].push(paths[p++]);
                    });
                }
                segs.forEach((sg, k) => this.shapes[k].forEach(el => {
                    if (el.getAttribute('d') !== sg.d) el.setAttribute('d', sg.d);
                }));
            }
        }

        // Static mini pie for template cards (starts at 12 o'clock)
        function miniPieSVG(activities, size = 56) {
            const total = totalMinutesOf(activities) || 1;
            let acc = 0;
            const shapes = activities.map((a, i) => {
                const d = wedgePath(50, 50, 46, acc / total, (acc + a.duration) / total);
                acc += a.duration;
                const pat = resolvePattern(a, i);
                return `<path d="${d}" fill="${a.color}" stroke="white" stroke-width="1"/>` + (pat ? `<path d="${d}" fill="url(#mtp-${pat})"/>` : '');
            }).join('');
            return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true" class="shrink-0"><circle cx="50" cy="50" r="49" class="ck-face" stroke-width="1"/>${shapes}</svg>`;
        }

        // =====================================================================
        // LIVE UPDATES (once a second: clock hands, countdown, end time)
        // Everything else only re-renders when something actually changes.
        // =====================================================================
        let mainClock = null;
        let floatClock = null;
        let pipClock = null;
        let lastLiveKey = '';

        function remainingPlanSeconds() {
            if (state.mode === AppMode.RUNNING) {
                return state.activities.reduce((sum, a, i) => {
                    if (a.completed || i < state.currentIndex) return sum;
                    if (i === state.currentIndex) return sum + a.remainingSeconds;
                    return sum + a.duration * 60;
                }, 0);
            }
            if (state.mode === AppMode.PLANNING) return totalMinutesOf(state.activities) * 60;
            return 0;
        }

        function nowString() {
            return clockTime(new Date());
        }

        function floatTitle() {
            if (state.mode === AppMode.RUNNING) {
                const a = state.activities[state.currentIndex];
                if (a) return `${formatTime(a.remainingSeconds)}${state.isRunning ? '' : ' (paused)'} • ${a.name || 'Untitled Activity'}`;
            }
            if (state.mode === AppMode.SUMMARY) return 'Session complete';
            return `Clock • ${nowString()}`;
        }

        function liveValues() {
            const cur = state.activities[state.currentIndex];
            const running = state.mode === AppMode.RUNNING && cur;
            return {
                countdown: running ? formatTime(cur.remainingSeconds) : '',
                now: nowString(),
                endsAt: clockTime(new Date(Date.now() + remainingPlanSeconds() * 1000)),
                face: faceLabel(),
                floatTitle: floatTitle()
            };
        }

        function fillLive(doc, vals) {
            doc.querySelectorAll('[data-live]').forEach(el => {
                const v = vals[el.dataset.live];
                if (v === undefined) return;
                if (el.dataset.live === 'face') el.hidden = !v;
                if (el.textContent !== v) el.textContent = v;
            });
        }

        function updateLive(force = false) {
            const nowMs = Date.now();
            const cur = state.activities[state.currentIndex];
            const key = Math.floor(nowMs / 1000) + '|' + (cur ? cur.remainingSeconds : '') + '|' + state.mode + state.isRunning;
            if (!force && key === lastLiveKey) return;
            lastLiveKey = key;
            state.now = new Date(nowMs);

            const vals = liveValues();

            // Tab title shows the countdown (visible even when the tab is in the background).
            // Activity names are left out on purpose: analytics records page titles.
            let title = DEFAULT_TITLE;
            if (state.mode === AppMode.RUNNING && cur) title = `${state.isRunning ? '' : '⏸ '}${vals.countdown} | MyTimer.io`;
            else if (state.mode === AppMode.SUMMARY) title = '✓ Session complete | MyTimer.io';
            if (document.title !== title) document.title = title;

            const pipOpen = pipWindow && !pipWindow.closed;
            if (!document.hidden) {
                if (mainClock && mainClock.svg.isConnected) mainClock.update();
                if (floatClock && floatEl && !floatEl.hidden && !floatState.minimized) floatClock.update();
                fillLive(document, vals);
            }
            if (pipOpen) {
                if (pipClock) pipClock.update();
                fillLive(pipWindow.document, vals);
                if (pipWindow.document.title !== vals.floatTitle) pipWindow.document.title = vals.floatTitle;
            }
        }

        function structuralKey() {
            return state.mode + '|' + state.currentIndex + '|' + state.isRunning;
        }

        // Single heartbeat: keeps the timer accurate and the display fresh
        function heartbeat() {
            const before = structuralKey();
            tick();
            if (structuralKey() !== before) {
                if (isTyping) { pendingRender = true; updatePanels(); }
                else render();
            } else {
                updateLive();
            }
        }

        // =====================================================================
        // RENDERING (only when something structural changes)
        // =====================================================================
        const card = 'bg-white dark:bg-slate-900 rounded-3xl border border-slate-100 dark:border-slate-800 shadow-sm';
        const btnPrimary = 'bg-brand-600 hover:bg-brand-700 text-white';
        const btnSecondary = 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700';

        function navButton(onclick, icon, label, active = false, pressed = null) {
            return `<button onclick="${onclick}" class="w-12 h-12 grid place-items-center rounded-xl transition-colors ${active ? 'bg-brand-100 dark:bg-brand-900/40 text-brand-700 dark:text-brand-300' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'}" title="${label}" aria-label="${label}"${pressed !== null ? ` aria-pressed="${pressed}"` : ''}>${icon}</button>`;
        }

        function switchButton(on, onclick, label) {
            return `<button type="button" role="switch" aria-checked="${on}" aria-label="${label}" onclick="${onclick}" class="h-11 px-1 shrink-0 flex items-center">
                <span class="w-12 h-7 rounded-full flex items-center transition-colors ${on ? 'bg-brand-600' : 'bg-slate-300 dark:bg-slate-600'}">
                    <span class="w-5 h-5 bg-white rounded-full shadow transition-transform ${on ? 'translate-x-6' : 'translate-x-1'}"></span>
                </span>
            </button>`;
        }

        function createStatsCard(label, value, iconName, colorClass) {
            return `
                <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-100 dark:border-slate-700 shadow-sm flex items-center gap-4">
                    <div class="p-3 rounded-xl ${colorClass}">${icons[iconName]}</div>
                    <div>
                        <p class="text-sm font-medium text-slate-500 dark:text-slate-400">${label}</p>
                        <p class="text-xl font-bold text-slate-900 dark:text-white">${value}</p>
                    </div>
                </div>`;
        }

        function clockSection(footer) {
            return `
                <section class="bg-gradient-to-br from-brand-50 to-white dark:from-slate-900 dark:to-brand-950/40 rounded-3xl border border-slate-100 dark:border-slate-800 shadow-sm p-6 sm:p-8">
                    <div id="main-clock" class="relative w-full max-w-md mx-auto aspect-square"></div>
                    <div class="mt-3 flex justify-center min-h-[28px]">
                        <span data-live="face" hidden class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-white/80 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700"></span>
                    </div>
                    ${footer}
                </section>`;
        }

        function templateRow(t) {
            const total = totalMinutesOf(t.activities);
            return `
                <button onclick="applyTemplateById('${t.id}')" class="w-full text-left p-3 bg-slate-50 dark:bg-slate-800 rounded-2xl hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors border border-slate-100 dark:border-slate-700 flex items-center gap-3">
                    <div class="text-2xl w-10 text-center" aria-hidden="true">${t.icon}</div>
                    <div class="flex-1 min-w-0">
                        <p class="font-bold text-sm text-slate-900 dark:text-white truncate">${escapeHTML(t.name)}</p>
                        <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">${t.activities.length} steps • ${formatDuration(total)}</p>
                    </div>
                    ${miniPieSVG(t.activities, 40)}

        function runningView() {

        function settingsModal() {
            const faceBtn = (id, label) => `
                <button onclick="setClockFace('${id}')" role="radio" aria-checked="${state.clockFace === id}" class="h-12 rounded-xl border-2 text-sm font-bold transition-colors ${state.clockFace === id ? 'border-brand-600 bg-brand-50 dark:bg-brand-950/50 text-brand-700 dark:text-brand-200' : 'border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 hover:border-slate-300'}">${label}</button>`;
            return `
                <div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4" onclick="if(event.target === this) closeSettings();">

                            </div>

                            <div class="flex items-start justify-between gap-4">
                                <div>
                                    <p class="text-sm font-bold text-slate-900 dark:text-white">Second hand</p>

                                ${switchButton(state.showSeconds, 'toggleSeconds()', 'Second hand')}

                                <p class="text-sm font-bold mb-3 text-slate-900 dark:text-white">Completion Sound</p>
